name: Finish plugin-only SOL core

on:
  push:
    branches: [feat/plugin-input-api-v1]
    paths:
      - scripts/finish-plugin-only-core.mjs
      - .github/workflows/finish-plugin-only-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node scripts/finish-plugin-only-core.mjs
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit final plugin-only core
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src apps/server/package.json pnpm-lock.yaml .github/workflows/windows-package.yml
          git commit -m "Make external providers plugin-only"
          git push origin HEAD:feat/plugin-input-api-v1
