name: Fix Plugin Input API v1 types

on:
  push:
    branches: [ feat/plugin-input-api-v1 ]
    paths:
      - scripts/fix-plugin-input-api-v1-types.mjs
      - .github/workflows/fix-plugin-input-api-v1-types.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-plugin-input-api-v1-types.mjs
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/ingestion/plugin-input-service.ts
          git commit -m "Fix Plugin Input API principal types"
          git push origin HEAD:feat/plugin-input-api-v1
