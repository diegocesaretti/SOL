name: Enforce plugin-only external inputs

on:
  push:
    branches: [feat/plugin-input-api-v1]
    paths:
      - scripts/enforce-plugin-only-inputs.mjs
      - .github/workflows/enforce-plugin-only-inputs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/enforce-plugin-only-inputs.mjs
      - name: Commit plugin-only core
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src
          git commit -m "Remove native external ingestion paths"
          git push origin HEAD:feat/plugin-input-api-v1
