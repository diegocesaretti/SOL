name: Remove native external connectors

on:
  push:
    branches: [feat/plugin-input-api-v1]
    paths:
      - scripts/remove-native-external-connectors.mjs
      - .github/workflows/remove-native-external-connectors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/remove-native-external-connectors.mjs
      - name: Commit removal
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove native external connector implementations"
          git push origin HEAD:feat/plugin-input-api-v1
