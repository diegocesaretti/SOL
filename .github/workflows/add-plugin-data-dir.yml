name: Add Plugin Data Dir

on:
  push:
    branches: [ feat/plugin-input-api-v1 ]
    paths:
      - scripts/add-plugin-data-dir.mjs
      - .github/workflows/add-plugin-data-dir.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/add-plugin-data-dir.mjs
      - name: Commit generated change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/plugins/manager.ts
          git commit -m "Persist plugin data outside install directories"
          git push origin HEAD:feat/plugin-input-api-v1
