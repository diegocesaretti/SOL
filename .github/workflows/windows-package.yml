name: Windows portable package

on:
  push:
    branches: [ main, feat/windows-standalone-package, fix/windows-package-flat-node-modules, fix/first-run-database-config ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      # Full cross-platform tests remain mandatory in the normal CI workflow.
      # Two Codex tests leave temporary handles briefly open on Windows runners,
      # so this packaging job only needs the compiler plus package-specific checks.
      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Verify synchronized SOL versions
        shell: pwsh
        run: |
          $rootVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $serverVersion = (Get-Content -Raw apps/server/package.json | ConvertFrom-Json).version
          if ($rootVersion -ne $serverVersion) {
            throw "SOL root/server version mismatch: $rootVersion != $serverVersion"
          }
          Write-Host "SOL version: $rootVersion"

      - name: Build SOL server
        shell: pwsh
        run: pnpm build

      # Do not archive pnpm's linked node_modules layout. Windows ZIP extraction can
      # lose those links. Build a real flat production tree inside the portable folder.
      - name: Create production server deployment
        shell: pwsh
        run: |
          $server = 'dist/windows/SOL/apps/server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Copy-Item apps/server/package.json "$server/package.json" -Force
          Push-Location $server
          try {
            npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
          } finally {
            Pop-Location
          }
          Copy-Item apps/server/dist "$server/dist" -Recurse -Force

      - name: Add portable Node runtime and SOL support files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/SOL/runtime | Out-Null
          New-Item -ItemType Directory -Force dist/windows/SOL/scripts/windows | Out-Null
          New-Item -ItemType Directory -Force dist/windows/SOL/packages/database/migrations | Out-Null
          Copy-Item (Get-Command node).Source dist/windows/SOL/runtime/node.exe
          Copy-Item scripts/windows/sol-tray.ps1 dist/windows/SOL/scripts/windows/sol-tray.ps1
          Copy-Item packages/database/migrations/*.sql dist/windows/SOL/packages/database/migrations/ -Force
          Copy-Item .env.example dist/windows/SOL/.env.example

      - name: Write packaged build identity
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $identity = [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            channel = 'stable'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/windows/SOL/version.json'),
            $identity,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish SOL.exe launcher and updater
        shell: pwsh
        run: |
          dotnet publish packaging/windows/SolLauncher/SolLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/launcher
          Copy-Item dist/windows/launcher/SOL.exe dist/windows/SOL/SOL.exe
          dotnet publish packaging/windows/SolUpdater/SolUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/updater
          Copy-Item dist/windows/updater/SOL.Updater.exe dist/windows/SOL/SOL.Updater.exe

      - name: Verify portable runtime resolves SOL Core packages
        shell: pwsh
        run: |
          $node = (Resolve-Path 'dist/windows/SOL/runtime/node.exe').Path
          Push-Location 'dist/windows/SOL/apps/server'
          try {
            & $node --input-type=module -e "await import('pg'); await import('zod'); await import('@modelcontextprotocol/server'); console.log('portable SOL Core dependencies resolve')"
            if ($LASTEXITCODE -ne 0) { throw 'Portable Node dependency resolution failed' }
            & $node --input-type=module -e "await import('./dist/database/client.js'); await import('./dist/modules/plugins/bundled.js'); console.log('database and bundled-plugin runtimes import successfully')"
            if ($LASTEXITCODE -ne 0) { throw 'Portable SOL runtime import failed' }
          } finally {
            Pop-Location
          }

      - name: Verify core package structure
        shell: pwsh
        run: |
          $required = @(
            'dist/windows/SOL/SOL.exe',
            'dist/windows/SOL/SOL.Updater.exe',
            'dist/windows/SOL/version.json',
            'dist/windows/SOL/runtime/node.exe',
            'dist/windows/SOL/apps/server/package.json',
            'dist/windows/SOL/apps/server/dist/index.js',
            'dist/windows/SOL/apps/server/dist/modules/plugins/bundled.js',
            'dist/windows/SOL/apps/server/node_modules/pg/package.json',
            'dist/windows/SOL/apps/server/node_modules/zod/package.json',
            'dist/windows/SOL/packages/database/migrations/0021_connections.sql',
            'dist/windows/SOL/scripts/windows/sol-tray.ps1',
            'dist/windows/SOL/.env.example'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing package component: $path" } }
          if (Test-Path dist/windows/SOL/.env) { throw 'Real .env must never be bundled' }
          if (Test-Path dist/windows/SOL/bundled-plugins) { throw 'Core snapshot must be created before bundled plugins are added' }
          Write-Host "SOL.exe: $((Get-Item dist/windows/SOL/SOL.exe).Length) bytes"
          Write-Host "SOL.Updater.exe: $((Get-Item dist/windows/SOL/SOL.Updater.exe).Length) bytes"
          Write-Host "node.exe: $((Get-Item dist/windows/SOL/runtime/node.exe).Length) bytes"

      - name: Create core-only Windows ZIP
        shell: pwsh
        run: |
          $zip = 'dist/SOL-Core-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist/windows/SOL -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "SOL-Core-Windows.zip SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Download and verify latest stable official plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = Join-Path $PWD 'dist/windows/SOL/bundled-plugins'
          New-Item -ItemType Directory -Force $bundleDir | Out-Null
          $maxBytes = 256MB
          $definitions = @(
            [ordered]@{
              id = 'nexo-whatsapp'
              repository = 'diegocesaretti/Whatsapp-Codex-Nexo'
              releaseTag = 'sol-plugin-latest'
              file = 'Nexo.solplugin'
              url = 'https://github.com/diegocesaretti/Whatsapp-Codex-Nexo/releases/download/sol-plugin-latest/Nexo.solplugin'
            },
            [ordered]@{
              id = 'codex-audio-remote'
              repository = 'diegocesaretti/Codex-audio-remote'
              releaseTag = 'sol-plugin-latest'
              file = 'CodexAudioRemote.solplugin'
              url = 'https://github.com/diegocesaretti/Codex-audio-remote/releases/download/sol-plugin-latest/CodexAudioRemote.solplugin'
            },
            [ordered]@{
              id = 'home-assistant'
              repository = 'diegocesaretti/SOL'
              releaseTag = 'home-assistant-plugin-latest'
              file = 'HomeAssistant.solplugin'
              url = 'https://github.com/diegocesaretti/SOL/releases/download/home-assistant-plugin-latest/HomeAssistant.solplugin'
            }
          )

          $catalogPlugins = @()
          foreach ($definition in $definitions) {
            $destination = Join-Path $bundleDir $definition.file
            Write-Host "Downloading $($definition.id) from $($definition.url)"
            Invoke-WebRequest -Uri $definition.url -OutFile $destination -Headers @{ 'User-Agent' = 'SOL-Full-Windows-Build/0.15.0' }
            $file = Get-Item $destination
            if ($file.Length -le 0 -or $file.Length -gt $maxBytes) {
              throw "Bundled plugin $($definition.id) has invalid size: $($file.Length)"
            }

            $digest = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $inspectRoot = Join-Path $env:RUNNER_TEMP ("sol-plugin-" + [guid]::NewGuid().ToString('N'))
            $inspectZip = "$inspectRoot.zip"
            New-Item -ItemType Directory -Force $inspectRoot | Out-Null
            Copy-Item $destination $inspectZip -Force
            try {
              Expand-Archive -Path $inspectZip -DestinationPath $inspectRoot -Force
              $manifestPath = Join-Path $inspectRoot 'sol-plugin.json'
              if (-not (Test-Path $manifestPath)) { throw "Bundled plugin $($definition.id) has no root sol-plugin.json" }
              $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
              if ($manifest.id -ne $definition.id) {
                throw "Bundled plugin id mismatch: expected $($definition.id), got $($manifest.id)"
              }
              if (-not $manifest.version -or -not $manifest.name) {
                throw "Bundled plugin $($definition.id) has incomplete manifest identity"
              }
              $catalogPlugins += [ordered]@{
                id = [string]$manifest.id
                name = [string]$manifest.name
                version = [string]$manifest.version
                file = [string]$definition.file
                sha256 = $digest
                repository = [string]$definition.repository
                releaseTag = [string]$definition.releaseTag
              }
              Write-Host "Bundled $($manifest.id) $($manifest.version) · $($file.Length) bytes · SHA256=$digest"
            } finally {
              Remove-Item $inspectRoot -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $inspectZip -Force -ErrorAction SilentlyContinue
            }
          }

          $catalog = [ordered]@{
            schemaVersion = 1
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            plugins = $catalogPlugins
          } | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            (Join-Path $bundleDir 'catalog.json'),
            $catalog,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify Full bundle catalog
        shell: pwsh
        run: |
          $bundleDir = 'dist/windows/SOL/bundled-plugins'
          $catalog = Get-Content -Raw "$bundleDir/catalog.json" | ConvertFrom-Json
          if ($catalog.schemaVersion -ne 1) { throw 'Invalid bundled plugin catalog schema' }
          if (@($catalog.plugins).Count -ne 3) { throw "Expected 3 bundled plugins, got $(@($catalog.plugins).Count)" }
          $expected = @('nexo-whatsapp', 'codex-audio-remote', 'home-assistant')
          foreach ($id in $expected) {
            $entry = @($catalog.plugins | Where-Object id -eq $id)
            if ($entry.Count -ne 1) { throw "Missing or duplicate bundled plugin: $id" }
            $path = Join-Path $bundleDir $entry[0].file
            if (-not (Test-Path $path)) { throw "Bundled package missing: $path" }
            $digest = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne [string]$entry[0].sha256) { throw "Bundled package hash mismatch: $id" }
          }
          if (Test-Path dist/windows/SOL/.env) { throw 'Real .env must never be bundled' }
          Write-Host 'SOL Full bundle catalog:'
          $catalog.plugins | ForEach-Object { Write-Host " - $($_.id) $($_.version) [$($_.sha256)]" }

      - name: Create Full Windows ZIP and update manifest
        shell: pwsh
        run: |
          $zip = 'dist/SOL-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist/windows/SOL -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/sol-windows-latest/SOL-Windows.zip"
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = 'stable'
            version = $version
            commit = $env:GITHUB_SHA
            downloadUrl = $downloadUrl
            sha256 = $hash
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/update-manifest.json'),
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "SOL-Windows.zip Full SHA256=$hash"
          Write-Host "SOL-Windows.zip size=$((Get-Item $zip).Length)"
          Write-Host "SOL-Core-Windows.zip size=$((Get-Item 'dist/SOL-Core-Windows.zip').Length)"

      - name: Publish stable SOL Windows release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'sol-windows-latest'
          $notes = 'SOL Windows 0.15+ Full: SOL Core + latest stable Nexo, Codex Audio Remote and Home Assistant plugins captured and verified at build time. SOL-Core-Windows.zip is the optional core-only package. Real credentials are never included.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'SOL Windows Full' --notes $notes --prerelease --target $env:GITHUB_SHA
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'SOL Windows Full' --notes $notes
          }
          gh release upload $tag dist/SOL-Windows.zip dist/SOL-Core-Windows.zip dist/update-manifest.json --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload SOL Windows package artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SOL-Windows
          path: |
            dist/SOL-Windows.zip
            dist/SOL-Core-Windows.zip
            dist/update-manifest.json
          if-no-files-found: error
          retention-days: 30
