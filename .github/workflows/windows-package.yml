name: Windows portable package

on:
  push:
    branches: [ main, feat/windows-standalone-package, fix/windows-package-flat-node-modules, fix/first-run-database-config ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      # Full cross-platform tests remain mandatory in the normal CI workflow.
      # Two Codex tests leave temporary handles briefly open on Windows runners,
      # so this packaging job only needs the compiler plus package-specific checks.
      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Build SOL server
        shell: pwsh
        run: pnpm build

      # Do not archive pnpm's linked node_modules layout. Windows ZIP extraction can
      # lose those links. Build a real flat production tree inside the portable folder.
      - name: Create production server deployment
        shell: pwsh
        run: |
          $server = 'dist/windows/SOL/apps/server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Copy-Item apps/server/package.json "$server/package.json" -Force
          Push-Location $server
          try {
            npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
          } finally {
            Pop-Location
          }
          Copy-Item apps/server/dist "$server/dist" -Recurse -Force

      - name: Add portable Node runtime and SOL support files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/SOL/runtime | Out-Null
          New-Item -ItemType Directory -Force dist/windows/SOL/scripts/windows | Out-Null
          New-Item -ItemType Directory -Force dist/windows/SOL/packages/database/migrations | Out-Null
          Copy-Item (Get-Command node).Source dist/windows/SOL/runtime/node.exe
          Copy-Item scripts/windows/sol-tray.ps1 dist/windows/SOL/scripts/windows/sol-tray.ps1
          Copy-Item packages/database/migrations/*.sql dist/windows/SOL/packages/database/migrations/ -Force
          Copy-Item .env.example dist/windows/SOL/.env.example

      - name: Write packaged build identity
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $identity = [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            channel = 'stable'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/windows/SOL/version.json'),
            $identity,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish SOL.exe launcher and updater
        shell: pwsh
        run: |
          dotnet publish packaging/windows/SolLauncher/SolLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/launcher
          Copy-Item dist/windows/launcher/SOL.exe dist/windows/SOL/SOL.exe
          dotnet publish packaging/windows/SolUpdater/SolUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/updater
          Copy-Item dist/windows/updater/SOL.Updater.exe dist/windows/SOL/SOL.Updater.exe

      - name: Verify portable runtime resolves SOL Core packages
        shell: pwsh
        run: |
          $node = (Resolve-Path 'dist/windows/SOL/runtime/node.exe').Path
          Push-Location 'dist/windows/SOL/apps/server'
          try {
            & $node --input-type=module -e "await import('pg'); await import('zod'); await import('@modelcontextprotocol/server'); console.log('portable SOL Core dependencies resolve')"
            if ($LASTEXITCODE -ne 0) { throw 'Portable Node dependency resolution failed' }
            & $node --input-type=module -e "await import('./dist/database/client.js'); console.log('database client imports successfully')"
            if ($LASTEXITCODE -ne 0) { throw 'Portable database client import failed' }
          } finally {
            Pop-Location
          }

      - name: Verify package structure
        shell: pwsh
        run: |
          $required = @(
            'dist/windows/SOL/SOL.exe',
            'dist/windows/SOL/SOL.Updater.exe',
            'dist/windows/SOL/version.json',
            'dist/windows/SOL/runtime/node.exe',
            'dist/windows/SOL/apps/server/dist/index.js',
            'dist/windows/SOL/apps/server/node_modules/pg/package.json',
            'dist/windows/SOL/apps/server/node_modules/zod/package.json',
            'dist/windows/SOL/packages/database/migrations/0021_connections.sql',
            'dist/windows/SOL/scripts/windows/sol-tray.ps1',
            'dist/windows/SOL/.env.example'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing package component: $path" } }
          if (Test-Path dist/windows/SOL/.env) { throw 'Real .env must never be bundled' }
          Write-Host "SOL.exe: $((Get-Item dist/windows/SOL/SOL.exe).Length) bytes"
          Write-Host "SOL.Updater.exe: $((Get-Item dist/windows/SOL/SOL.Updater.exe).Length) bytes"
          Write-Host "node.exe: $((Get-Item dist/windows/SOL/runtime/node.exe).Length) bytes"

      - name: Create SOL-Windows.zip and update manifest
        shell: pwsh
        run: |
          $zip = 'dist/SOL-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist/windows/SOL -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/sol-windows-latest/SOL-Windows.zip"
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = 'stable'
            version = $version
            commit = $env:GITHUB_SHA
            downloadUrl = $downloadUrl
            sha256 = $hash
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/update-manifest.json'),
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "SHA256=$hash"

      - name: Publish stable SOL Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'sol-windows-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'SOL Windows portable' --notes 'Portable Windows build of SOL. Open SOL.exe; Node and the rollback-capable updater are bundled. External providers are installed as plugins and real .env credentials are never included.' --prerelease --target $env:GITHUB_SHA
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA
          }
          gh release upload $tag dist/SOL-Windows.zip dist/update-manifest.json --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload SOL Windows package artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SOL-Windows
          path: |
            dist/SOL-Windows.zip
            dist/update-manifest.json
          if-no-files-found: error
          retention-days: 30
