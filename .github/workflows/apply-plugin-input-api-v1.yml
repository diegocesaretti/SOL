name: Apply Plugin Input API v1

on:
  push:
    branches: [ feat/plugin-input-api-v1 ]
    paths:
      - scripts/apply-plugin-input-api-v1.mjs
      - .github/workflows/apply-plugin-input-api-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[plugin-input-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply integration
        run: node scripts/apply-plugin-input-api-v1.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src
          git commit -m "Integrate Plugin Input API v1 [plugin-input-applied]"
          git push origin HEAD:feat/plugin-input-api-v1
