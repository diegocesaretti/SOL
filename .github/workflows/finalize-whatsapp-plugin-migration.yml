name: Finalize WhatsApp plugin migration

on:
  push:
    branches: [feat/plugin-input-api-v1]
    paths:
      - scripts/finalize-whatsapp-plugin-migration.mjs
      - .github/workflows/finalize-whatsapp-plugin-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-input-api-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/finalize-whatsapp-plugin-migration.mjs
      - name: Commit source migration changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src
          git commit -m "Adopt legacy WhatsApp accounts into plugin runtime"
          git push origin HEAD:feat/plugin-input-api-v1
