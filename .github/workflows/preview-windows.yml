name: Preview Windows package

on:
  push:
    branches: [ feat/unified-mcp-tool-registry ]
    paths:
      - ".github/workflows/preview-windows.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - shell: pwsh
        run: corepack enable
      - shell: pwsh
        run: pnpm install --no-frozen-lockfile
      - shell: pwsh
        run: pnpm typecheck
      - shell: pwsh
        run: pnpm build
      - name: Create production server deployment
        shell: pwsh
        run: |
          $server = 'dist/windows/SOL/apps/server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Copy-Item apps/server/package.json "$server/package.json" -Force
          Push-Location $server
          try {
            npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
          } finally {
            Pop-Location
          }
          Copy-Item apps/server/dist "$server/dist" -Recurse -Force
      - name: Add portable runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/SOL/runtime | Out-Null
          New-Item -ItemType Directory -Force dist/windows/SOL/scripts/windows | Out-Null
          Copy-Item (Get-Command node).Source dist/windows/SOL/runtime/node.exe
          Copy-Item scripts/windows/sol-tray.ps1 dist/windows/SOL/scripts/windows/sol-tray.ps1
          Copy-Item .env.example dist/windows/SOL/.env.example
      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet publish packaging/windows/SolLauncher/SolLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/launcher
          Copy-Item dist/windows/launcher/SOL.exe dist/windows/SOL/SOL.exe
      - name: Verify portable package
        shell: pwsh
        run: |
          $node = (Resolve-Path 'dist/windows/SOL/runtime/node.exe').Path
          Push-Location 'dist/windows/SOL/apps/server'
          try {
            & $node --input-type=module -e "await import('pg'); await import('zod'); await import('@modelcontextprotocol/server')"
            if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
            & $node --input-type=module -e "await import('./dist/database/client.js')"
            if ($LASTEXITCODE -ne 0) { throw 'Database client import failed' }
          } finally {
            Pop-Location
          }
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/windows/SOL -DestinationPath dist/SOL-Windows.zip -CompressionLevel Optimal
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'sol-windows-preview-pr12'
          gh release delete $tag -y --cleanup-tag 2>$null
          gh release create $tag dist/SOL-Windows.zip --target $env:GITHUB_SHA --title 'SOL Windows preview · PR 12' --notes 'Preview build from feat/unified-mcp-tool-registry. Not main.' --prerelease
