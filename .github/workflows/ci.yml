name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify synchronized SOL versions
        run: |
          node --input-type=module -e "const fs=await import('node:fs'); const root=JSON.parse(fs.readFileSync('package.json','utf8')).version; const server=JSON.parse(fs.readFileSync('apps/server/package.json','utf8')).version; if(root!==server) throw new Error('SOL root/server version mismatch: '+root+' != '+server); console.log('SOL version',root)"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test Pulse Engine plugin (Panorama, dedup, Nexo safeguards)
        run: node --test plugins/pulse-engine/*.test.mjs plugins/bwa-3d/pulse-publisher.test.mjs

      - name: Build
        run: pnpm build

      - name: Package Pulse and BWA3D updates
        run: |
          node scripts/pack-sol-plugin.mjs plugins/pulse-engine dist/PulseEngine-0.8.0.solplugin
          node scripts/pack-sol-plugin.mjs plugins/bwa-3d dist/BWA3D-0.2.2-Pulse.solplugin

      - name: Upload Pulse update packages
        uses: actions/upload-artifact@v4
        with:
          name: pulse-panorama-v080-packages
          path: |
            dist/PulseEngine-0.8.0.solplugin
            dist/BWA3D-0.2.2-Pulse.solplugin
          if-no-files-found: error
      - name: Package Hello SOL sample plugin
        run: pnpm plugin:pack:hello

      - name: Upload Hello SOL sample plugin
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hello-sol-plugin
          path: dist/hello-sol.solplugin
          if-no-files-found: error
