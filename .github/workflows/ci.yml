name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package Hello SOL sample plugin
        run: pnpm plugin:pack:hello

      - name: Upload Hello SOL sample plugin
        uses: actions/upload-artifact@v4
        with:
          name: hello-sol-plugin
          path: dist/hello-sol.solplugin
          if-no-files-found: error
