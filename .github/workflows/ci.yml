name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify synchronized SOL versions
        run: |
          node --input-type=module -e "const fs=await import('node:fs'); const root=JSON.parse(fs.readFileSync('package.json','utf8')).version; const server=JSON.parse(fs.readFileSync('apps/server/package.json','utf8')).version; if(root!==server) throw new Error('SOL root/server version mismatch: '+root+' != '+server); console.log('SOL version',root)"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test Stremio Control protocol
        run: node --test plugins/stremio-control/*.test.mjs

      - name: Build
        run: pnpm build

      - name: Package Hello SOL sample plugin
        run: pnpm plugin:pack:hello

      - name: Package Stremio Control plugin
        run: node scripts/pack-sol-plugin.mjs plugins/stremio-control dist/StremioControl.solplugin

      - name: Upload Hello SOL sample plugin
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hello-sol-plugin
          path: dist/hello-sol.solplugin
          if-no-files-found: error

      - name: Upload Stremio Control plugin
        uses: actions/upload-artifact@v4
        with:
          name: StremioControl-solplugin
          path: dist/StremioControl.solplugin
          if-no-files-found: error
